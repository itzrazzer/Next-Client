name: Build NextFam Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build --stacktrace

      - name: Rename jar
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" dist/NextFam-Client.jar

      - name: Upload NextFam-Client.jar
        uses: actions/upload-artifact@v4
        with:
          name: NextFam-Client
          path: dist/NextFam-Client.jar
